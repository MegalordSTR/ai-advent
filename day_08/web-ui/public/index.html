<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #60a5fa;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            height: calc(100vh - 100px);
        }
        .sidebar {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
        }
        .chat-area {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        .agents-list {
            list-style: none;
        }
        .agent-item {
            padding: 12px 16px;
            margin-bottom: 10px;
            background: #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .agent-item:hover {
            background: #475569;
        }
        .agent-item.active {
            background: #3b82f6;
        }
        .agent-name {
            font-weight: 600;
            font-size: 16px;
        }
        .agent-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 4px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
        }
        .message.user {
            background: #3b82f6;
            margin-left: auto;
        }
        .message.assistant {
            background: #475569;
            margin-right: auto;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            min-height: 60px;
        }
        textarea:focus {
            outline: none;
            border-color: #60a5fa;
        }
        button {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
        }
        .error {
            color: #f87171;
            background: #7f1d1d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>🤖 AI Agent Chat</h1>
    <div class="container">
        <div class="sidebar">
            <h2>Agents</h2>
            <ul class="agents-list" id="agentsList">
                <!-- Agents will be loaded here -->
            </ul>
        </div>
        <div class="chat-area">
            <div class="messages" id="messagesContainer">
                <!-- Messages will appear here -->
            </div>
            <div class="error hidden" id="errorBox"></div>
            <div class="input-area">
                <textarea id="messageInput" placeholder="Type your message here..." rows="3"></textarea>
                <button id="sendButton">Send</button>
            </div>
            <div class="status" id="status">Select an agent to start chatting</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let currentAgent = null;
        let isLoading = false;

        // DOM elements
        const agentsList = document.getElementById('agentsList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');
        const errorBox = document.getElementById('errorBox');

        // Fetch agents from API
        async function loadAgents() {
            try {
                status.textContent = 'Loading agents...';
                const response = await fetch(`${API_BASE}/agents`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const agents = await response.json();
                renderAgents(agents);
                status.textContent = 'Select an agent to start chatting';
            } catch (error) {
                showError(`Failed to load agents: ${error.message}`);
            }
        }

        // Render agents list
        function renderAgents(agents) {
            agentsList.innerHTML = '';
            agents.forEach(agent => {
                const li = document.createElement('li');
                li.className = 'agent-item';
                li.innerHTML = `
                    <div class="agent-name">${escapeHtml(agent.Name)}</div>
                    <div class="agent-desc">${escapeHtml(agent.Description || 'No description')}</div>
                `;
                li.addEventListener('click', () => selectAgent(agent));
                agentsList.appendChild(li);
            });
        }

        // Select an agent
        async function selectAgent(agent) {
            currentAgent = agent;
            // Update UI
            document.querySelectorAll('.agent-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.agent-item').classList.add('active');
            
            status.textContent = `Loading conversation with ${agent.Name}...`;
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
            
            // Load messages for this agent
            try {
                const response = await fetch(`${API_BASE}/agents/${encodeURIComponent(agent.Name)}/messages`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const messages = await response.json();
                renderMessages(messages);
                status.textContent = `Ready to chat with ${agent.Name}`;
            } catch (error) {
                showError(`Failed to load messages: ${error.message}`);
                renderMessages([]);
            }
        }

        // Render messages
        function renderMessages(messages) {
            messagesContainer.innerHTML = '';
            // Filter out system messages (they're in the prompt)
            const displayMessages = messages.filter(msg => msg.Role !== 'system');
            
            if (displayMessages.length === 0) {
                messagesContainer.innerHTML = '<div class="message assistant">No messages yet. Start the conversation!</div>';
                return;
            }
            
            displayMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.Role}`;
                div.textContent = msg.Content;
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Send message
        async function sendMessage() {
            if (!currentAgent || isLoading) return;
            
            const text = messageInput.value.trim();
            if (!text) return;
            
            // Add user message to UI immediately
            const userMsg = { Role: 'user', Content: text };
            renderMessages([...getCurrentMessages(), userMsg]);
            messageInput.value = '';
            messageInput.disabled = true;
            sendButton.disabled = true;
            isLoading = true;
            status.textContent = 'Thinking...';
            
            try {
                const response = await fetch(`${API_BASE}/agents/${encodeURIComponent(currentAgent.Name)}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                // Add assistant response
                const assistantMsg = { Role: 'assistant', Content: data.response };
                renderMessages([...getCurrentMessages(), assistantMsg]);
                status.textContent = `Ready to chat with ${currentAgent.Name}`;
            } catch (error) {
                showError(`Failed to send message: ${error.message}`);
                status.textContent = 'Error - try again';
            } finally {
                messageInput.disabled = false;
                sendButton.disabled = false;
                isLoading = false;
                messageInput.focus();
            }
        }

        // Helper to get current messages from DOM (simplified)
        function getCurrentMessages() {
            const messages = [];
            const messageElements = messagesContainer.querySelectorAll('.message');
            messageElements.forEach(el => {
                const role = el.classList.contains('user') ? 'user' : 'assistant';
                messages.push({ Role: role, Content: el.textContent });
            });
            return messages;
        }

        // Show error
        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
            setTimeout(() => errorBox.classList.add('hidden'), 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        loadAgents();
    </script>
</body>
</html>
